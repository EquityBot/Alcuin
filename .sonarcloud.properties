# Each page script runs alone in the browser, so these 2 inline their own copies of the picker inspection.
sonar.cpd.exclusions=browser-scripts/model.js,browser-scripts/thinking.js

# fixtures/ holds test inputs; fixtures/browser-dom/ is saved ChatGPT page markup for the DOM tests,
# not pages anyone serves, so its missing <title> and lang and stray tabindex are not defects.
# vendor/hyper is hyper 1.12.0 with the small patch vendor/hyper/PATCH.json records; its findings are
# in upstream code.
sonar.exclusions=fixtures/**,vendor/**

# rust:S7493 and rust:S7487 carry NOSONAR where an async fn makes a synchronous call on a small local file
# or directory, or a test waits for its own child. Each call holds its Tokio worker until it returns, so tasks
# queued on that worker wait as long; the binaries run 4 workers, and none of these calls makes a network request.
