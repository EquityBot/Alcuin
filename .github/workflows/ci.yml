name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tests run real completions; they must never deliver desktop notifications.
  ORACLE_DISABLE_NOTIFICATIONS: "1"

jobs:
  # Offline checks only. Tests that need a signed-in browser or a live provider are
  # #[ignore]d and run locally; live receipts never run in CI.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Real-time scanning can hold newly written files, so atomic renames retry past the tests'
      # durable-write budgets. The runner is disposable.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Timing-bounded tests (1 s and 5 s durable-write and retirement budgets) fail closed when the
      # runner is contended: Windows runs them serially, Linux on two threads. Temporary files stay
      # on the workspace drive: a durable write's median was 6 to 9 ms on the Windows system drive
      # and 0.2 to 0.6 ms there (3 runners, 30 October 2026).
      - run: cargo test --locked -- --test-threads=${{ matrix.os == 'windows-latest' && 1 || 2 }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
