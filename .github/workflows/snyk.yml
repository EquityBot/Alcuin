name: Snyk

# Snyk cannot read Cargo.lock directly. Each Cargo set is described as
# CycloneDX SBOMs, one per workspace member, and tested with `snyk sbom test`;
# an npm set is tested from its package-lock.json. It runs weekly and when a
# manifest or lockfile changes.
on:
  schedule:
    - cron: "33 5 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/snyk.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/snyk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Snyk open source test
    # Pull requests from forks, and Dependabot's (which get Dependabot secrets
    # only), receive no SNYK_TOKEN; the weekly run scans their changes.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # One dependency set per line: cargo:<workspace directory> or
      # npm:<package-lock.json>.
      SNYK_TARGETS: |
        cargo:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      # A prebuilt release whose checksum the action's manifest pins, instead of
      # compiling the generator on every run.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-cyclonedx@0.5.9
      # `snyk test` applies .snyk itself; `snyk sbom test` does not, so its ignores
      # are applied here: a finding is dropped when .snyk ignores its ID for every
      # path ('*') with an `expires` still to come. Without a .snyk nothing is
      # ignored. Snyk exiting above 1 (an error), or output the filter cannot
      # read, fails the job.
      - name: Test each dependency set
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          # Without the token every SBOM is still generated, so a broken lock
          # shows up, but the job fails because nothing was scanned.
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::The SNYK_TOKEN repository secret is not set, so nothing was scanned."
          fi
          # {"<ID>": "<latest unexpired expires>"} for each ID .snyk ignores everywhere.
          ignored='{}'
          if [ -f .snyk ]; then
            ignored=$(yq -o=json '.ignore // {}' .snyk | jq -c '
              with_entries(.value = ([.value[] | .["*"]? | .expires? // empty
                | select((sub("\\.[0-9]+"; "") | fromdateiso8601) > now)] | max))
              | with_entries(select(.value != null))')
          fi
          report=$RUNNER_TEMP/snyk.json
          # Tests one SBOM and prints each finding as open or ignored; fails on an
          # open finding or a result it cannot read.
          sbom_test() {
            local code=0 findings open
            echo "== $1"
            snyk sbom test --experimental --json --file="$1" > "$report" || code=$?
            if [ "$code" -gt 1 ] || [ ! -s "$report" ]; then
              cat "$report"; echo
              echo "::error::snyk sbom test failed on $1 (exit $code)."
              return 1
            fi
            # One line per vulnerable path, `open` or `ignored`.
            if ! findings=$(jq -r --argjson ignored "$ignored" '
              if type == "array" then .[] else . end
              | if (.vulnerabilities | type) == "array" then .vulnerabilities[]
                else error("no vulnerabilities list in the Snyk output") end
              | $ignored[.id] as $until
              | "\(if $until then "ignored" else "open" end) [\(.severity // "?" | ascii_upcase)] \(.title) (\(.id)) in \(.packageName)@\(.version) via \(.from // [] | join(" > "))\(if $until then ", ignored until \($until)" else "" end)"
            ' "$report"); then
              cat "$report"; echo
              echo "::error::Could not read the Snyk results for $1."
              return 1
            fi
            [ -z "$findings" ] || printf '%s\n' "$findings"
            open=$(printf '%s\n' "$findings" | grep -c '^open ' || true)
            if [ "$open" -gt 0 ]; then
              echo "::error::$open open Snyk finding(s) in $1."
              return 1
            elif [ "$code" -eq 1 ] && [ -z "$findings" ]; then
              cat "$report"; echo
              echo "::error::Snyk failed $1 without listing a vulnerability."
              return 1
            fi
          }
          status=0
          while IFS=: read -r kind target; do
            [ -n "$kind" ] || continue
            case "$kind" in
              npm) [ -z "$SNYK_TOKEN" ] || snyk test --file="$target" --project-name="$target" || status=1 ;;
              cargo)
                # rustup reads a pinned version from the toolchain file.
                if [ -f "$target/rust-toolchain.toml" ] || [ -f "$target/rust-toolchain" ]; then
                  (cd "$target" && rustup toolchain install) \
                    || { echo "::error::rustup could not install the toolchain for $target"; status=1; continue; }
                fi
                (cd "$target" && cargo cyclonedx --format json --spec-version 1.5 --override-filename snyk-sbom) \
                  || { echo "::error::cargo cyclonedx failed for $target"; status=1; continue; }
                list=$(mktemp)
                find "$target" -name snyk-sbom.json -not -path '*/target/*' -print0 > "$list" \
                  || { echo "::error::Cannot list the SBOMs for $target"; status=1; continue; }
                [ -s "$list" ] || { echo "::error::cargo cyclonedx wrote no SBOM for $target"; status=1; continue; }
                while IFS= read -r -d '' sbom; do
                  [ -z "$SNYK_TOKEN" ] || sbom_test "$sbom" || status=1
                done < "$list" ;;
              *) echo "::error::Unknown dependency set $kind:$target"; status=1 ;;
            esac
          done <<< "$SNYK_TARGETS"
          [ -n "$SNYK_TOKEN" ] || exit 1
          exit "$status"
